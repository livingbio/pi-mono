version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Version-update PRs are silenced; security-update PRs ignore this
    # limit and keep flowing regardless (see GitHub's Dependabot docs).
    open-pull-requests-limit: 0
    groups:
      security-fixes:
        applies-to: security-updates
        patterns:
          - "*"
